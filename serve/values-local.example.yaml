global:
  environment: "vscode"

source_code_path: "/path/to/your/local/serve"

storageClass: &storage_class local-path
access_mode: &access_mode ReadWriteOnce
accessmode: *access_mode
accessModes:
  - ReadWriteOnce

bitwarden:
  enabled: false

namespace: default

studio:
  domain: studio.127.0.0.1.nip.io
  session_cookie_domain: .127.0.0.1.nip.io
  superuserPassword: "yourpassword"
  superuserEmail: "your.email@example.com"
  djangoAdminUrlPath: "admin"
  storageClass: *storage_class
  debug: true
  init: true
  inactive_users: false
  storage:
    storageClass: *storage_class
  media:
    storage:
      storageClass: *storage_class
      accessModes: *access_mode
  csrf_trusted_origins: "https://studio.127.0.0.1.nip.io:8080"
  sessionCache:
    enabled: true
  superUser: admin
  static:
    image:
      repository: mystudio
      tag: latest
      pullPolicy: Never
  image:
    repository: mystudio
    tag: latest
    pullPolicy: Never
  resources:
    limits:
      cpu: "1000m"
      memory: "4Gi"
    requests:
      cpu: "400m"
    media:
      mountStudio: false
  emailService:
    enabled: false
  connectionPool:
    enabled: true
    healthChecks: true
    dbPoolStatsLogging: false
    minSize: 4
    maxSize: 10
    timeout: 30
    maxIdle: 300
    idleSessionTimeout: 30min
    idleInTransactionSessionTimeout: 10min
  githubApiTokenToggle: false
  dockerhubToken:
  dockerhubUsername: ""
  orcid_client_id: "dummy"
  orcid_client_secret: "dummy"
  invenioEnabled: false
  invenioUrl: ""
  invenioApiToken: ""
  invenioMockMode: true
  readinessProbe:
    enabled: false
  livenessProbe:
    enabled: false
  metrics:
    enabled: false
  authPermissionCache:
    enabled: true
    timeout: 30
    denyTimeout: 5
  authRequestLogging:
    enabled: true
  publicAppsCache:
    timeout: 30
  projectPermissionCache:
    timeout: 5
  securityContext:
    enabled: false
  doiPrefix: "10.83812/SCILIFELAB"

rabbitmq:
  auth:
    erlangCookie:
    existingPasswordSecret: ""
    existingPasswordSecretKey: ""
  resources:
    limits:
      cpu:
      ephemeral-storage: 50Mi
      memory:
    requests:
      cpu:
      ephemeral-storage: 50Mi
      memory:

redis:
  enabled: true
  auth:
    existingSecret: ""
    existingSecretPasswordKey: ""

celeryFlower:
  enabled: true

networkPolicy:
  enable: false
  kubernetes:
    cidr:
    port: 6443 
  internal_cidr:
    - 10.0.0.0/8
    - 192.168.0.0/16
    - 172.0.0.0/20
  ingress_controller_namespace: kube-system

ingress:
  djangoAdminAccessRestriction:
    enabled: false
  hosts:
    - host: studio.127.0.0.1.nip.io
  tls: []

gateway:
  create: true
  enabled: true
  name: default
  namespace: gateway
  gatewayClassName: nginx
  port: 80
  domain: studio.127.0.0.1.nip.io
  sectionName: serve-dev-subdomains
  studioSectionName: http
  whitelistingSnippetsFilter:
    enabled: false
    # IP ranges allowed to access admin endpoints
    allowedCIDRs:
      - "10.0.0.0/8"
      - "130.238.0.0/16"
      - "130.237.0.0/16"
      - "130.229.0.0/16"
      - "192.168.0.0/16"
      - "172.0.0.0/20"
  rateLimit:
    enabled: false
    rate: "2r/s"
    burst: 20
    noDelay: true
    zoneSize: "10m"
    condition:
      type: Header
      header:
        name: X-Forwarded-For
        value: ".*"

reloader:
  enabled: true
  namespace: default

postgresql:
  storageClass: *storage_class
  auth:
    username: postgres
    database: postgres
    password:
    existingSecret: ""
    secretKeys:
      adminPasswordKey: ""
      userPasswordKey: ""
  primary:
    persistence:
      storageClass: *storage_class
      accessModes:
        - *access_mode
