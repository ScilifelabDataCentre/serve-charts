{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
  namespace: {{ .Release.Namespace }}
spec:
  hostnames:
  - {{ .Values.gateway.domain | quote }}
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name | default "default" }}
    namespace: {{ .Values.gateway.namespace | default "gateway" }}
    sectionName: {{ .Values.gateway.studioSectionName | default .Values.gateway.sectionName | default "http" }}
    port: {{ .Values.gateway.port | default 443 }}
  rules:
  - backendRefs:
    - name: {{ .Release.Name }}-studio
      kind: Service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /
  - backendRefs:
    - name: {{ .Release.Name }}-studio
      kind: Service
      port: 8080
    matches:
    - path:
        type: PathPrefix
        value: /{{ .Values.studio.djangoAdminUrlPath }}/
    {{- if .Values.gateway.whitelistingSnippetsFilter.enabled }}
    filters:
    - type: ExtensionRef
      extensionRef:
        group: gateway.nginx.org
        kind: SnippetsFilter
        name: {{ .Release.Name }}-admin-ip-allowlist
    {{- end }}
  - backendRefs:
    {{- if .Values.studio.debug }}
    - name: {{ .Release.Name }}-studio
      kind: Service
      port: 8080
    {{- else }}
    - name: {{ .Release.Name }}-static
      kind: Service
      port: 8081
    {{- end }}
    matches:
    - path:
        type: PathPrefix
        value: /static/
    - path:
        type: PathPrefix
        value: /media/
{{- end }}
