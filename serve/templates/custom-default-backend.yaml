# Configuration for the default backend: renders custom error pages (403/404/500/502/503)
# for unmatched subdomains (wildcard) and, via error-pages-snippetsfilter.yaml, for upstream
# 5xx errors on the studio app's own HTTPRoute.
{{- $scheme := "https" }}
{{- if eq (int .Values.gateway.port) 80 }}{{- $scheme = "http" }}{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-errors
  namespace: {{ .Values.namespace | default "default" }}
  labels:
    app.kubernetes.io/name: nginx-errors
    app.kubernetes.io/part-of: ingress-nginx
spec:
  selector:
    app.kubernetes.io/name: nginx-errors
    app.kubernetes.io/part-of: ingress-nginx
  ports:
  - port: 80
    targetPort: 8080
    name: http
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-errors-template
  namespace: {{ .Values.namespace | default "default" }}
data:
  error-page.tpl.html: |-
{{ .Files.Get "assets/error-page.tpl.html" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-errors
  namespace: {{ .Values.namespace | default "default" }}
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    app.kubernetes.io/name: nginx-errors
    app.kubernetes.io/part-of: ingress-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-errors
      app.kubernetes.io/part-of: ingress-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nginx-errors
        app.kubernetes.io/part-of: ingress-nginx
    spec:
      volumes:
      - name: error-pages-template
        configMap:
          name: nginx-errors-template
      containers:
      - name: nginx-error-server
        image: "{{ .Values.errorPages.image.repository }}:{{ .Values.errorPages.image.tag }}"
        ports:
        - containerPort: 8080
        volumeMounts:
        - name: error-pages-template
          mountPath: /templates
          readOnly: true
        env:
        - name: HTML_TEMPLATE
          value: /templates/error-page.tpl.html
        - name: SEND_SAME_HTTP_CODE
          value: {{ .Values.errorPages.sendSameHttpCode | quote }}
        - name: HOMEPAGE_URL
          value: "{{ $scheme }}://{{ .Values.studio.domain }}/"
        - name: ADD_LINK
          value: "Contact us=mailto:serve@scilifelab.se"
        - name: ADD_CODE
          value: |-
            403=Forbidden|You don't have permission to view this page.
            404=Not found|Page cannot be served. Go back to the home page and try again.
            500=Internal problem|Service encountered an internal problem. Try the home page, or try again a bit later. If it persists, contact us.
            502=Temporarily not available|Service is temporarily unavailable. Please try again shortly.
            503=Temporarily not available|The application is being created, please wait a moment, then refresh.
            504=Temporarily not available|The application is taking longer than expected to respond. Please try again shortly.
---
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-serve-errors-route
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ .Values.gateway.name | default "default" }}
    namespace: {{ .Values.gateway.namespace | default "gateway" }}
    sectionName: {{ .Values.gateway.sectionName | default "serve-dev-subdomains" }}
    port: {{ .Values.gateway.port | default (contains "nip.io" .Values.gateway.domain | ternary 80 443) }}
  hostnames:
  - "*.{{ .Values.gateway.domain }}"
  - "*.gw.{{ .Values.gateway.domain }}"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nginx-errors
      port: 80
{{- else }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/custom-http-errors: 503,502,500,404,403
    nginx.ingress.kubernetes.io/default-backend: nginx-errors
  name: wildcard-serve-errors-ingress
  namespace: {{ .Values.namespace }}
spec:
  defaultBackend:
    service:
      name: nginx-errors
      port:
        number: 80
  rules:
  - host: '*.{{ .Values.studio.domain }}'
    http:
      paths:
      - backend:
          service:
            name: nginx-errors
            port:
              number: 80
        path: /404.html
        pathType: ImplementationSpecific
  tls:
  - hosts:
    - '*.{{ .Values.studio.domain }}'
    secretName: prod-ingress
{{- end }}
