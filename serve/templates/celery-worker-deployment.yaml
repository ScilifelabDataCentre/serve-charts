apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    reloader.stakater.com/auto: "true"
  labels:
    io.kompose.service: {{ .Release.Name }}-celery-worker
    name: {{ .Release.Name }}-celery-worker
  name: {{ .Release.Name }}-celery-worker
spec:
  replicas: {{ .Values.celeryWorkers.replicas | default 2 }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      name: {{ .Release.Name }}-celery-worker
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.20.0 ()
        {{- if .Values.celeryWorkers.metrics.enabled }}
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: {{ .Values.celeryWorkers.metrics.port | default 8001 | quote }}
        {{- end }}
      creationTimestamp: null
      labels:
        io.kompose.service: {{ .Release.Name }}-celery-worker
        name: {{ .Release.Name }}-celery-worker
        app: studio-app
        networking/allow-internet-egress: "true"
        allow-api-access: "true"
    spec:
      serviceAccountName: {{ include "common.names.fullname" .}}
      initContainers:
        - name: wait-for-db
          image: postgres
          command: ['sh', '-c', 'until pg_isready --host={{ .Values.postgresql.fullnameOverride }} --port={{ .Values.postgresql.primary.service.ports.postgresql }}; do echo waiting for database; sleep 5; done;']
          resources:
            limits:
              cpu: "100m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "512Mi"
        - name: wait-for-studio
          image: busybox:1.28.4
          command: ['sh', '-c', "until nslookup {{ .Release.Name }}-{{ .Values.studio.servicename }}; do echo waiting for {{ .Release.Name }}-{{ .Values.studio.servicename }} service; sleep 5; done"]
          resources:
            limits:
              cpu: "100m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "512Mi"
      containers:
      - args:
        - sh
        - ./scripts/run_worker.sh
        {{- if .Values.studio.securityContext.enabled }}
        securityContext:
          runAsUser: {{ .Values.studio.securityContext.runAsUser }}
          runAsGroup: {{ .Values.studio.securityContext.runAsGroup }}
          allowPrivilegeEscalation: {{ .Values.studio.securityContext.allowPrivilegeEscalation }}
          privileged: {{ .Values.studio.securityContext.privileged }}
          capabilities:
            drop:
              - all
        {{- end }}
        env:
        - name: BASE_PATH
          value: "/app"
        - name: CELERY_CONCURRENCY
          value: {{ .Values.celeryWorkers.concurrency | default 4 | quote }}
        - name: DB_POOL_MIN_SIZE
          value: {{ .Values.celeryWorkers.connectionPool.minSize | default 0 | quote }}
        - name: DB_POOL_MAX_SIZE
          value: {{ .Values.celeryWorkers.connectionPool.maxSize | default 2 | quote }}
        - name: DB_POOL_TIMEOUT
          value: {{ .Values.celeryWorkers.connectionPool.timeout | default .Values.studio.connectionPool.timeout | default 30 | quote }}
        - name: DB_POOL_MAX_IDLE
          value: {{ .Values.celeryWorkers.connectionPool.maxIdle | default 60 | quote }}
        {{- if .Values.celeryWorkers.metrics.enabled }}
        - name: PROMETHEUS_MULTIPROC_DIR
          value: /tmp/prometheus
        - name: CELERY_METRICS_PORT
          value: {{ .Values.celeryWorkers.metrics.port | default 8001 | quote }}
        {{- end }}
        {{- include "studio.env" . | nindent 8 }}
        image: {{ .Values.studio.image.repository }}:{{ .Values.studio.image.tag }}
        imagePullPolicy: {{ .Values.studio.image.pullPolicy }}
        name: {{ .Release.Name }}-celery-worker
        {{- if .Values.celeryWorkers.metrics.enabled }}
        ports:
        - containerPort: {{ .Values.celeryWorkers.metrics.port | default 8001 }}
          name: metrics
        {{- end }}
        resources:
          limits:
            cpu: {{ .Values.celeryWorkers.resources.limits.cpu }}
            memory: {{ .Values.celeryWorkers.resources.limits.memory }}
          requests:
            cpu: {{ .Values.celeryWorkers.resources.requests.cpu }}
            memory: {{ .Values.celeryWorkers.resources.requests.memory }}
        volumeMounts:
          {{- if .Values.chartcontroller.addSecret }}
          - name: config
            mountPath: {{ .Values.studio.kubeconfig_dir | quote }}
            readOnly: true
          {{- end }}
          - mountPath: /app/studio/settings.py
            subPath: settings.py
            name: {{ .Release.Name}}-settings-configmap
          {{- if .Values.celeryWorkers.metrics.enabled }}
          - mountPath: /tmp/prometheus
            name: prometheus-multiproc
          {{- end }}
      restartPolicy: Always
      volumes:
      {{- if .Values.chartcontroller.addSecret }}
      - name: config
        secret:
          secretName: {{ .Release.Name }}-chart-controller-secret
      {{- end }}
      {{- if .Values.celeryWorkers.metrics.enabled }}
      - name: prometheus-multiproc
        emptyDir: {}
      {{- end }}
      - name: {{ .Release.Name}}-settings-configmap
        configMap:
          name: {{ .Release.Name}}-settings-configmap
          items:
          - key: settings.py
            path: settings.py
status: {}
