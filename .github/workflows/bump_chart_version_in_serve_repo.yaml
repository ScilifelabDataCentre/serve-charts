name: New Helm chart version

on:
  pull_request:
    paths:
      - "apps/**/Chart.yaml"

jobs:
  update-json:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use the PR head commit to make base..head diffs reliable
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.TW_PAT }}
          
      - name: Find changed Chart.yaml files and build updates map
        id: find-charts
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Find all changed Chart.yaml files in the PR range (not just the last commit).
          # Support both:
          # - apps/<app>/Chart.yaml
          # - apps/<app>/chart/Chart.yaml
          CHANGED_FILES="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^apps/[^/]+/(Chart\.yaml|chart/Chart\.yaml)$' || true)"
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No Chart.yaml files changed. Exiting."
            exit 0
          fi

          echo "Changed chart files:"
          echo "$CHANGED_FILES"

          # Build a JSON object mapping HELM_NAME -> NEW_CHART_VERSION
          UPDATES_JSON='{}'
          while IFS= read -r chart_path; do
            # chart_path is one of:
            # - apps/<app>/Chart.yaml
            # - apps/<app>/chart/Chart.yaml
            # so the app name is always the 2nd path segment.
            APP_NAME="$(echo "$chart_path" | cut -d/ -f2)"

            # Map the app name to helm name
            case "$APP_NAME" in
              "custom-app") HELM_NAME="custom-app" ;;
              "dash") HELM_NAME="dash-app" ;;
              "filemanager") HELM_NAME="filemanager" ;;
              "jupyter-lab") HELM_NAME="lab" ;;
              "netpolicy") HELM_NAME="netpolicy" ;;
              "python-serve") HELM_NAME="python-serve" ;;
              "pytorch-serve") HELM_NAME="pytorch-serve" ;;
              "rstudio") HELM_NAME="rstudio" ;;
              "shiny") HELM_NAME="shinyapp" ;;
              "shinyproxy") HELM_NAME="shinyproxy" ;;
              "tensorflow-serve") HELM_NAME="tensorflow-serve" ;;
              "tissuumaps") HELM_NAME="tissuumaps" ;;
              "vscode") HELM_NAME="vscode" ;;
              "volumek8s") HELM_NAME="volumek8s" ;;
              *)
                echo "Unknown app: $APP_NAME. Exiting."
                exit 1
                ;;
            esac

            NEW_CHART_VERSION="$(yq e '.version' "$chart_path")"

            UPDATES_JSON="$(jq -c --arg k "$HELM_NAME" --arg v "$NEW_CHART_VERSION" '. + {($k): $v}' <<<"$UPDATES_JSON")"
          done <<<"$CHANGED_FILES"

          echo "Updates map:"
          echo "$UPDATES_JSON" | jq -r 'to_entries[] | " - \(.key): \(.value)"'

          # Export variables for later steps
          echo "UPDATES_JSON=$UPDATES_JSON" >> "$GITHUB_ENV"
          echo "JSON_FILE_PATH=fixtures/apps_fixtures.json" >> "$GITHUB_ENV"

      - name: Set up the SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.TW_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone the Serve repository
        run: |
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "teamwhale@scilifelab.se"
          # Check if the directory already exists
          if [ -d "serve" ]; then
            echo "Directory 'serve' already exists, removing it first..."
            rm -rf serve
          fi
          git clone git@github.com:ScilifelabDataCentre/serve.git

      - name: Import GPG key and configure commit signing
        run: |
          echo "${{ secrets.TW_GPG_PRIVATE_KEY }}" | gpg --batch --import
          git config --global user.signingkey "${{ secrets.GPG_KEY_ID }}"
          git config --global commit.gpgsign true
        env:
          GPG_PRIVATE_KEY: ${{ secrets.TW_GPG_PRIVATE_KEY }}

      - name: Update JSON file in the Serve repository
        run: |
          cd serve
          git checkout develop
          git checkout -b update/charts-fixtures-${{ github.event.pull_request.number }}-${{ github.run_id }}

          echo "Will update the following chart versions in $JSON_FILE_PATH:"
          echo '${{ env.UPDATES_JSON }}' | jq -r 'to_entries[] | " - \(.key): \(.value)"'

          jq -M --argjson updates '${{ env.UPDATES_JSON }}' '
            map(
              if (.fields.chart? | type) == "string" then
                .fields.chart |= (
                  reduce ($updates | to_entries[]) as $e
                    (.;
                      if startswith($e.key + ":")
                      then sub(":[^:]+$"; ":" + $e.value)
                      else .
                      end
                    )
                )
              else
                .
              end
            )
          ' "$JSON_FILE_PATH" > tmp.json

          # Check if the jq command was successful
          echo "Changes to be applied:"
          diff -u $JSON_FILE_PATH tmp.json || echo "No differences in diff" 

          mv tmp.json $JSON_FILE_PATH
          git add $JSON_FILE_PATH
          if git diff --staged --quiet; then
            echo "No changes to commit. The chart version might already be up-to-date."
            exit 1
          else
            git commit -S -m "Update chart versions in fixtures"
            git push -u origin update/charts-fixtures-${{ github.event.pull_request.number }}-${{ github.run_id }}
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.TW_PAT }}

      - name: Create a pull request in the Serve repository
        run: |
          gh pr create \
            --repo ScilifelabDataCentre/serve \
            --head update/charts-fixtures-${{ github.event.pull_request.number }}-${{ github.run_id }} \
            --base develop \
            --title "[Automated PR] Update chart versions in fixtures" \
            --body "This PR updates the \`chart\` field in \`${{ env.JSON_FILE_PATH }}\` for all charts whose \`Chart.yaml\` version changed in this PR.

          Updates:
          $(echo '${{ env.UPDATES_JSON }}' | jq -r 'to_entries[] | "- \(.key): \(.value)"')

          Please review and merge if everything looks good."
        env:
          GITHUB_TOKEN: ${{ secrets.TW_PAT }}
