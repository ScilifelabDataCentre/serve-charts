<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head></head>
    <body>
        <div id="navbar" th:fragment="navbar" th:if="${showNavbar and page == 'app'}">
            <style>
                .serve-loading-navbar {
                    min-height: 42px;
                    margin-bottom: 0;
                    background: #f7f7f7;
                    border-color: #ddd;
                }

                .serve-loading-navbar .navbar-text {
                    float: none;
                    margin: 10px 15px;
                    color: #333;
                    text-align: center;
                }
            </style>
            <nav class="navbar navbar-default navbar-fixed-top navbar-height serve-loading-navbar"
                 aria-live="polite"
                 role="status">
                <div class="container-fluid">
                    <p class="navbar-text">
                        <span aria-hidden="true" class="glyphicon glyphicon-time"></span>
                        The app is loading. Some apps may take a few minutes to become ready to use.
                    </p>
                </div>
            </nav>
            <script>
                (function () {
                    const originalSetupIframe = Shiny.ui.setupIframe;
                    let navbarHidden = false;
                    let readinessCheckId = null;

                    function hideNavbar() {
                        if (navbarHidden) {
                            return;
                        }

                        navbarHidden = true;
                        if (readinessCheckId !== null) {
                            window.clearInterval(readinessCheckId);
                            readinessCheckId = null;
                        }
                        $('#navbar').fadeOut('slow', function () {
                            $('body').css('padding-top', '0');
                            Shiny.ui.setShinyFrameHeight();
                        });
                    }

                    function waitForShinyReady(iframe) {
                        let frameDocument;
                        let frameJQuery;
                        let frameShiny;
                        let frameWindow;

                        try {
                            frameDocument = iframe.contentDocument;
                            frameWindow = iframe.contentWindow;
                            frameShiny = frameWindow && frameWindow.Shiny;
                            frameJQuery = frameWindow && (frameWindow.jQuery || frameWindow.$);
                        } catch (error) {
                            // Keep the message visible if iframe access fails.
                            return;
                        }

                        if (!frameDocument || !frameWindow) {
                            return;
                        }

                        if (typeof frameJQuery === 'function') {
                            frameJQuery(frameDocument).one('shiny:idle.serveLoadingNavbar', hideNavbar);
                        }

                        let initialized = false;
                        if (frameShiny && frameShiny.initializedPromise
                            && typeof frameShiny.initializedPromise.then === 'function') {
                            frameShiny.initializedPromise.then(function () {
                                initialized = true;
                            });
                        }

                        let idleSince = null;
                        if (readinessCheckId !== null) {
                            window.clearInterval(readinessCheckId);
                        }
                        readinessCheckId = window.setInterval(function () {
                            try {
                                frameDocument = iframe.contentDocument;
                                frameWindow = iframe.contentWindow;
                                frameShiny = frameWindow && frameWindow.Shiny;
                            } catch (error) {
                                idleSince = null;
                                return;
                            }

                            if (!frameDocument || !frameDocument.documentElement) {
                                idleSince = null;
                                return;
                            }

                            const socket = frameShiny && frameShiny.shinyapp && frameShiny.shinyapp.$socket;
                            const connected = initialized || (socket && socket.readyState === 1);
                            const busy = frameDocument.documentElement.classList.contains('shiny-busy');

                            if (!connected || busy) {
                                idleSince = null;
                                return;
                            }

                            if (idleSince === null) {
                                idleSince = Date.now();
                            } else if (Date.now() - idleSince >= 500) {
                                hideNavbar();
                            }
                        }, 250);
                    }

                    Shiny.ui.setupIframe = function () {
                        originalSetupIframe.apply(Shiny.ui, arguments);
                        $('#shinyframe').one('load', function () {
                            waitForShinyReady(this);
                        });
                    };

                    const navbarHeight = $('.navbar-height').height();
                    if (navbarHeight !== undefined) {
                        $('body').css('padding-top', navbarHeight + 'px');
                    }
                })();
            </script>
        </div>
    </body>
</html>
