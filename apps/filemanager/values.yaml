appname: filemanager
project:
  name: project
  slug: project-slug

permission: public

global:
  protocol: TCP
  domain: studio.127.0.0.1.nip.io
  auth_domain: studio.127.0.0.1.nip.io

ingress:
  secretName: prod-ingress
  clientMaxBodySize: 10000M

gateway:
  enabled: true
  name: default
  namespace: default
  port: 80
  rateLimit:
    enabled: false
    rate: "2r/s"
    burst: 20
    noDelay: true
    zoneSize: "10m"

apps:
  volumeK8s: {}

appconfig:
  image: ghcr.io/scilifelabdatacentre/serve-filemanager:250310-1430

service:
  name: filemanager-svc
  port: 8080
  targetPort: 8080

podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - all
