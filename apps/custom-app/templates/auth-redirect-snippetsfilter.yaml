{{- if and .Values.gateway.enabled (ne .Values.permission "public") (ne .Values.permission "link") }}
{{- $scheme := "https" }}
{{- if eq (int .Values.gateway.port) 80 }}{{- $scheme = "http" }}{{- end }}
apiVersion: gateway.nginx.org/v1alpha1
kind: SnippetsFilter
metadata:
  name: {{ .Release.Name }}-auth
  namespace: {{ .Release.Namespace }}
spec:
  snippets:
  - context: http.server.location
    value: |
      auth_request /auth/;
      error_page 401 = @login_redirect;
  - context: http.server
    value: |
      location /auth/ {
        internal;
        proxy_pass http://serve-studio.{{ .Release.Namespace }}.svc.cluster.local:8080/auth/?release={{ .Release.Name }};
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
      }
      location @login_redirect {
        return 302 {{ $scheme }}://{{ .Values.global.domain }}/accounts/login/?next=$request_uri;
      }
{{- end }}
