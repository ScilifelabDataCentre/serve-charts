appname: rstudio
project:
  name: project
  slug: project-slug

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: nvidia.com/gpu.present
          operator: In
          values:
          - "true"

global:
  protocol: TCP
  domain: studio.127.0.0.1.nip.io
  auth_domain: studio.127.0.0.1.nip.io
  environment: vscode

apps:
  volumek8s:

appconfig:
  port: 8787
  image: ghcr.io/scilifelabdatacentre/serve-rstudio:250304-1611

service:
  name: rstudio-svc
  port: 80

ingress:
  v1beta1: false
  secretName: prod-ingress
  clientMaxBodySize: 100M

gateway:
  enabled: true
  name: default
  namespace: gateway
  rateLimit:
    enabled: false
    rate: "2r/s"
    burst: 20
    noDelay: true
    zoneSize: "10m"

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  privileged: false
  capabilities:
    drop:
      - all

flavor:
  limits:
    cpu: 1
    ephemeral-storage: 800Mi
    memory: 1Gi
  requests:
    cpu: 100m
    ephemeral-storage: 500Mi
    memory: 500Mi
