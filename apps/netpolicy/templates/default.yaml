apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-project-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      project: {{ .Values.project.slug }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              project: {{ .Values.project.slug }}
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-fabric
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-ingress-from-studio
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      project: {{ .Values.project.slug }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: studio-app
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx-gateway-fabric
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nginx-gateway
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-egress-to-project
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      project: {{ .Values.project.slug }}
  policyTypes:
  - Egress
  egress:
  - to:
    - podSelector:
        matchLabels:
          project: {{ .Values.project.slug }}
  - to:
    - ipBlock:
        cidr: {{ .Values.kubeDnsCIDR | default "10.43.0.10/32" }}
    ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-api-access
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      allow-api-access: "true"
      project: {{ .Values.project.slug }}
  policyTypes:
  - Egress
  egress:
  - to:
    - ipBlock:
        cidr: {{ .Values.kubernetesApiCIDR | default "10.43.0.1/32" }}
    ports:
    - port: 443
      protocol: TCP
